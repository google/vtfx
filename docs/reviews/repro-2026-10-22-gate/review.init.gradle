// Runs the review reproductions without adding them to the regular test suite.
// See ../2026-10-22-gate.md for the command and expected failures.
gradle.projectsEvaluated {
    def gate = gradle.rootProject.findProject(':vtfx-gate')
    def gateAndroid = gradle.rootProject.findProject(':vtfx-gate-android')
    def session = gradle.rootProject.findProject(':vtfx-session')
    if (gate == null || gateAndroid == null || session == null) return
    def sources = gradle.rootProject.file('docs/reviews/repro-2026-10-22-gate')
    def output = gradle.rootProject.layout.buildDirectory.dir('review-repros/2026-10-22-gate').get().asFile
    def gateKotlin = gate.tasks.named('compileTestKotlin').get()
    def androidTest = gateAndroid.tasks.named('testDebugUnitTest').get()
    def androidKotlin = gateAndroid.tasks.named('compileDebugUnitTestKotlin').get()
    def sessionTest = session.tasks.named('test').get()
    def sessionKotlin = session.tasks.named('compileTestKotlin').get()
    def compile = gate.tasks.register('compileReviewRepro', JavaExec) {
        dependsOn gateKotlin, androidKotlin, sessionKotlin
        classpath = gate.configurations.getByName('kotlinCompilerClasspath')
        mainClass.set('org.jetbrains.kotlin.cli.jvm.K2JVMCompiler')
        inputs.file(new File(sources, 'ReviewReproTest.kt'))
        inputs.files(gateKotlin.libraries, androidKotlin.libraries, sessionKotlin.libraries)
        outputs.dir(new File(output, 'classes'))
        doFirst {
            def libs = (gateKotlin.libraries.files + androidKotlin.libraries.files + sessionKotlin.libraries.files)
            def friends = (gateKotlin.friendPaths.files + androidKotlin.friendPaths.files + sessionKotlin.friendPaths.files)
            args = ['-no-stdlib', '-no-reflect', '-jvm-target', '17',
                    '-classpath', libs.collect { it.path }.join(File.pathSeparator),
                    '-Xfriend-paths=' + friends.collect { it.path }.join(','),
                    '-opt-in=com.google.vtfx.core.InternalVtfxApi',
                    '-d', new File(output, 'classes').path,
                    new File(sources, 'ReviewReproTest.kt').path]
            gateKotlin.pluginClasspath.files.each { args('-Xplugin=' + it.path) }
        }
    }
    [gate, gateAndroid].each { p ->
        p.tasks.register('reviewRepro', Test) {
            dependsOn compile, androidTest.taskDependencies
            useJUnit()
            testClassesDirs = p.files(new File(output, 'classes'))
            classpath = p.files(new File(output, 'classes')) + androidTest.classpath + gate.tasks.named('test').get().classpath + sessionTest.classpath
            systemProperties androidTest.systemProperties
            jvmArgs androidTest.jvmArgs
            workingDir androidTest.workingDir
            reports.html.outputLocation.set(new File(output, "report-${p.name}"))
            reports.junitXml.outputLocation.set(new File(output, "results-${p.name}"))
            testLogging { events 'passed', 'failed'; exceptionFormat 'full'; showStandardStreams true }
        }
    }
}
