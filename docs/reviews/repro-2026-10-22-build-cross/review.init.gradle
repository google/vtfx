// Runs the review reproductions without adding them to the regular test suite.
// See ../2026-10-22-build-cross.md for the command and expected failures.
gradle.projectsEvaluated {
    def p = gradle.rootProject.findProject(':vtfx-compose')
    if (p == null) return
    def sources = gradle.rootProject.file('docs/reviews/repro-2026-10-22-build-cross')
    def output = gradle.rootProject.layout.buildDirectory.dir('review-repros/2026-10-22-build-cross').get().asFile
    def original = p.tasks.named('testDebugUnitTest').get()
    def kotlin = p.tasks.named('compileDebugUnitTestKotlin').get()
    def buildLogicClasspath = gradle.rootProject.buildscript.configurations.getByName('classpath')
    def gradleApiJars = gradle.rootProject.fileTree(new File(gradle.gradleHomeDir, 'lib')) {
        include '*.jar'
    }
    def compile = p.tasks.register('compileReviewRepro', JavaExec) {
        dependsOn kotlin
        classpath = p.configurations.getByName('kotlinCompilerClasspath')
        mainClass.set('org.jetbrains.kotlin.cli.jvm.K2JVMCompiler')
        inputs.file(new File(sources, 'ReviewReproTest.kt'))
        inputs.files(kotlin.libraries)
        inputs.files(buildLogicClasspath)
        inputs.files(gradleApiJars)
        outputs.dir(new File(output, 'classes'))
        doFirst {
            def fullClasspath = (kotlin.libraries.files + buildLogicClasspath.files + gradleApiJars.files).collect { it.path }.join(File.pathSeparator)
            args = ['-no-stdlib', '-no-reflect', '-jvm-target', '17',
                    '-classpath', fullClasspath,
                    '-Xfriend-paths=' + kotlin.friendPaths.files.join(','),
                    '-opt-in=com.google.vtfx.core.InternalVtfxApi',
                    '-d', new File(output, 'classes').path,
                    new File(sources, 'ReviewReproTest.kt').path]
            kotlin.pluginClasspath.files.each { args('-Xplugin=' + it.path) }
        }
    }
    p.tasks.register('reviewRepro', Test) {
        dependsOn compile
        useJUnit()
        testClassesDirs = p.files(new File(output, 'classes'))
        classpath = p.files(new File(output, 'classes')) + original.classpath + buildLogicClasspath + gradleApiJars
        systemProperties original.systemProperties
        systemProperty 'vtfx.repoRoot', gradle.rootProject.projectDir.path
        jvmArgs original.jvmArgs
        workingDir original.workingDir
        reports.html.outputLocation.set(new File(output, 'report'))
        reports.junitXml.outputLocation.set(new File(output, 'results'))
        testLogging { events 'passed', 'failed'; exceptionFormat 'full'; showStandardStreams true }
    }
}
