# The pixels of images (docs/decisions/0080) are copied into bitmaps; a Bundle only passes through
# the IME's private commands.
types = ["android/graphics/Bitmap", "android/os/Bundle"]
members = [
    "android/content/Context.getSystemService(Ljava/lang/Class;)",
    "android/graphics/Bitmap.createBitmap",
    "android/graphics/Typeface.create",
    # Typefaces are keys of a cache.
    "android/graphics/Typeface.hashCode",
    # Information leaks through the log; only warnings are written.
    "android/util/Log.w",
