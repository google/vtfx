    "android/view/inputmethod/EditorInfo",
    "android/view/inputmethod/ExtractedText",
    "android/view/inputmethod/ExtractedTextRequest",
    "android/view/inputmethod/InputConnection",
    "android/view/inputmethod/InputContentInfo",
    "android/view/inputmethod/SurroundingText",
    "android/view/inputmethod/TextAttribute",
    "androidx/annotation/AnyThread",
    "androidx/annotation/FontRes",
    "androidx/annotation/MainThread",
    "androidx/annotation/RequiresApi",
    "androidx/compose/ui/platform/InspectorInfo",
    "androidx/compose/ui/platform/TextToolbar",
    "androidx/compose/ui/platform/ValueElementSequence",
    "androidx/compose/ui/platform/ViewConfiguration",
    "androidx/compose/ui/text/AnnotatedString",
    "androidx/compose/ui/text/font/DeviceFontFamilyName",
    "androidx/compose/ui/text/font/DeviceFontFamilyNameFontKt",
    "androidx/compose/ui/text/font/Font",
    "androidx/compose/ui/text/font/FontFamily",
    "androidx/compose/ui/text/font/FontFamily$Companion",
    "androidx/compose/ui/text/font/FontFamily$Resolver",
    "androidx/compose/ui/text/font/FontFamilyKt",
    "androidx/compose/ui/text/font/FontKt",
    "androidx/compose/ui/text/font/FontStyle",
    "androidx/compose/ui/text/font/FontStyle$Companion",
    "androidx/compose/ui/text/font/FontVariation$Settings",
