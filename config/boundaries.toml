    "androidx/compose/ui/text/font/GenericFontFamily",
    "androidx/compose/ui/viewinterop/AndroidView_androidKt",
    "java/lang/Runnable",
    # The random key that names a session in a display's saved view (docs/decisions/0095).
    "java/util/UUID",
    "java/util/WeakHashMap",
    "java/util/concurrent/atomic/AtomicBoolean",
    "java/util/function/Predicate",
    "kotlinx/coroutines/CoroutineScope",
    "kotlinx/coroutines/DelayKt",
    "kotlinx/coroutines/flow/Flow",
    "kotlinx/coroutines/flow/FlowKt",
]
packages = [
    "androidx/compose/foundation",
    "androidx/compose/foundation/gestures",
    "androidx/compose/foundation/layout",
    "androidx/compose/runtime",
    "androidx/compose/runtime/internal",
