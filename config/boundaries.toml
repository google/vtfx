# Module boundaries. The build logic checks the modules and their dependencies
# (build-logic/src/main/kotlin/vtfx.boundaries.gradle.kts, docs/decisions/0044), and
# scripts/check_boundaries.py checks restricted_apis.
#
# This is a guardrail against obvious mistakes, not an enforcement that cannot be bypassed (see
# docs/REQUIREMENTS.md section 6.1). The rationale is in docs/design/architecture.md.
#
# Changes to this file require security review (config/protected-paths.toml).

# The bootstrap methods that dynamic call sites and constants may use: those that the Kotlin and
# Java compilers use for lambdas and string concatenation. Their descriptors name classes of
# java/lang/invoke, which restricted_classes below does not allow otherwise.
bootstrap_methods = [
    "java/lang/invoke/LambdaMetafactory.altMetafactory",
    "java/lang/invoke/LambdaMetafactory.metafactory",
    "java/lang/invoke/StringConcatFactory.makeConcatWithConstants",
]

# The classes outside the project that the classes of every module with an allowlist may refer to
# (docs/decisions/0044): the language, the compiler's output, and data structures, none of which
# reaches the system. "classes" are allowed with all their members, but not their nested classes;
# "packages" allow the classes directly in them, not in their subpackages; "types" may only be named
# as types; "members" (owner.name, or owner.name(descriptor) may be used, and their owners named.
# Not here, so that a module must list them with a reason: kotlin.io (files and the console),
# kotlin.concurrent, kotlin.reflect, java.lang.System, Runtime, ClassLoader, and java.io.
[baseline_references]
classes = [
    "java/lang/Appendable",
    "java/lang/ArithmeticException",
    "java/lang/Boolean",
    "java/lang/Byte",
    "java/lang/CharSequence",
    "java/lang/Character",
    "java/lang/ClassCastException",
    "java/lang/Comparable",
    "java/lang/Deprecated",
    "java/lang/Double",
    "java/lang/Enum",
    "java/lang/Exception",
    "java/lang/Float",
    "java/lang/IllegalArgumentException",
    "java/lang/IllegalStateException",
    "java/lang/IndexOutOfBoundsException",
    "java/lang/Integer",
    "java/lang/Iterable",
    "java/lang/Long",
    "java/lang/Math",
    "java/lang/NoSuchFieldError",
    "java/lang/NullPointerException",
    "java/lang/Number",
    "java/lang/Object",
    "java/lang/RuntimeException",
    "java/lang/Short",
    "java/lang/String",
    "java/lang/StringBuilder",
    "java/lang/UnsupportedOperationException",
    "java/lang/Void",
    "java/lang/annotation/Annotation",
    "java/lang/annotation/ElementType",
    "java/lang/annotation/Retention",
    "java/lang/annotation/RetentionPolicy",
    "java/lang/annotation/Target",
    "java/util/ArrayList",
    "java/util/Arrays",
    "java/util/Collection",
    "java/util/Collections",
    "java/util/Comparator",
    "java/util/HashMap",
    "java/util/HashSet",
    "java/util/IdentityHashMap",
    "java/util/Iterator",
    "java/util/LinkedHashMap",
    "java/util/LinkedHashSet",
    "java/util/List",
    "java/util/ListIterator",
    "java/util/Map",
    "java/util/Map$Entry",
    "java/util/NoSuchElementException",
    "java/util/Objects",
    "java/util/Set",
    "java/util/TreeMap",
    "java/util/TreeSet",
    "org/jetbrains/annotations/NotNull",
    "org/jetbrains/annotations/Nullable",
]
packages = [
    "kotlin",
    "kotlin/annotation",
    "kotlin/collections",
    "kotlin/comparisons",
    "kotlin/enums",
    "kotlin/internal",
    "kotlin/jvm",
    "kotlin/jvm/functions",
    "kotlin/jvm/internal",
    "kotlin/math",
    "kotlin/ranges",
    "kotlin/sequences",
    "kotlin/text",
]
# Enum.valueOf takes the Class of the enum.
types = ["java/lang/Class"]
# The thread checks of docs/decisions/0021.
members = ["java/lang/Thread.currentThread"]

# Every project of the build must be listed here, with the modules it may depend on. The build logic
# checks the dependencies of every configuration of every project, as declared and as resolved, so
# dependencies added by plugins, on resolution, or by substitution are seen too; the tests have no
# list of their own.
[modules.vtfx-core]
allowed_dependencies = []
check_classes = true

[modules.vtfx-core.allowed_references]
classes = [
    "java/util/Base64",
    "java/util/Base64$Decoder",
    "java/util/regex/Matcher",
    "java/util/regex/Pattern",
    "java/util/zip/CRC32",
    # Inflates the zlib data of images of the kitty graphics protocol (docs/decisions/0038), with the
    # platform's native zlib.
    "java/util/zip/DataFormatException",
    "java/util/zip/Inflater",
]
packages = []
types = ["java/nio/charset/Charset"]
members = []

[modules.vtfx-font]
allowed_dependencies = ["vtfx-font-gate"]
check_classes = true

[modules.vtfx-font.allowed_references]
classes = ["java/lang/InterruptedException"]
packages = []
types = []
# Sanitizing stops when the thread is interrupted.
members = ["java/lang/Thread.interrupted"]

[modules.vtfx-font-gate]
allowed_dependencies = []
check_classes = true

[modules.vtfx-font-gate.allowed_references]
classes = [
    "java/io/ByteArrayOutputStream",
    # The canonical font is kept in a read-only direct buffer, which the platform's typefaces read
    # (docs/decisions/0041).
    "java/nio/Buffer",
    "java/nio/ByteBuffer",
]
packages = []
types = []
# The checksum that identifies a canonical font.
members = ["java/security/MessageDigest.digest", "java/security/MessageDigest.getInstance"]

# vtfx-core only for the InternalVtfxApi annotation (compileOnly).
[modules.vtfx-font-gate-android]
allowed_dependencies = ["vtfx-font-gate", "vtfx-core"]
check_classes = true

[modules.vtfx-input]
allowed_dependencies = ["vtfx-core"]
check_classes = true

[modules.vtfx-input.allowed_references]
classes = []
packages = []
types = []
members = []

[modules.vtfx-gate]
allowed_dependencies = ["vtfx-core"]
check_classes = true

[modules.vtfx-gate.allowed_references]
classes = ["java/io/ByteArrayOutputStream", "java/util/Base64", "java/util/Base64$Encoder"]
packages = []
types = ["java/nio/charset/Charset"]
members = ["java/util/Locale.ROOT"]

[modules.vtfx-gate-android]
allowed_dependencies = ["vtfx-gate"]
check_classes = true

[modules.vtfx-session]
allowed_dependencies = ["vtfx-core", "vtfx-input", "vtfx-gate"]
check_classes = true

[modules.vtfx-session.allowed_references]
classes = [
    "java/util/concurrent/CopyOnWriteArrayList",
    "java/util/concurrent/locks/Lock",
    "java/util/concurrent/locks/ReentrantLock",
]
packages = []
types = []
members = []

[modules.vtfx-compose]
allowed_dependencies = ["vtfx-core", "vtfx-input", "vtfx-gate", "vtfx-gate-android", "vtfx-session", "vtfx-font", "vtfx-font-gate", "vtfx-font-gate-android"]
check_classes = true

# The sample app uses only the public API, as a third-party app would. Its classes are not checked:
# an app may use any capability (docs/decisions/0044).
[modules.vtfx-sample]
allowed_dependencies = ["vtfx-compose"]
check_classes = false

# Classes whose fields and methods only the listed modules may use, directly or through a subtype.
# Other modules may still name them as types, for example to pass an instance on. Checked in the main
# classes of every module with check_classes = true (docs/decisions/0044).
[[restricted_members]]
classes = ["com/google/vtfx/gate/HostConnection"]
reason = "Only vtfx-gate may use the connection to the host. TerminalSession only hands it over (docs/decisions/0027)."
allowed_modules = ["vtfx-gate"]

[[restricted_members]]
classes = ["com/google/vtfx/gate/ClipboardAccess", "com/google/vtfx/gate/UrlOpener"]
reason = "Only vtfx-gate may call the clipboard and the URL opener, which vtfx-gate-android implements. TerminalSession only hands them over (docs/decisions/0042)."
allowed_modules = ["vtfx-gate", "vtfx-gate-android"]

# Classes and members that only the listed modules may refer to at all, in the main classes of every
# module with check_classes = true (docs/decisions/0044). Names are internal names of the JVM
# (android/content/Intent). "classes" includes their nested classes; "packages" includes their
# subpackages; "members" are owner.name, or owner.name(descriptor for the descriptors that start so,
# used through the owner or any of its subtypes. Kotlin's top-level declarations are members of
# their file's class (CompositionLocalsKt.getLocalClipboard for LocalClipboard).
[[restricted_classes]]
# Includes Compose's clipboard (LocalClipboardManager, LocalClipboard, ClipEntry).
classes = [
    "android/content/ClipboardManager",
    "android/content/ClipData",
    "android/text/ClipboardManager",
    "androidx/compose/ui/platform/AndroidClipboard",
    "androidx/compose/ui/platform/AndroidClipboardManager",
    "androidx/compose/ui/platform/ClipEntry",
    "androidx/compose/ui/platform/Clipboard",
    "androidx/compose/ui/platform/ClipboardManager",
]
members = [
    "androidx/compose/ui/platform/CompositionLocalsKt.getLocalClipboard",
    "androidx/compose/ui/platform/CompositionLocalsKt.getLocalClipboardManager",
]
reason = "Clipboard access must go through vtfx-gate-android."
allowed_modules = ["vtfx-gate-android"]

[[restricted_classes]]
# Includes Compose's URL opening (LocalUriHandler, UriHandler, LinkAnnotation.Url) and AndroidX's
# sharing and Custom Tabs (ShareCompat, CustomTabsIntent), which open other apps without naming Intent.
classes = [
    "android/app/PendingIntent",
    "android/content/Intent",
    "androidx/browser/customtabs/CustomTabsIntent",
    "androidx/compose/ui/platform/AndroidUriHandler",
    "androidx/compose/ui/platform/UriHandler",
    "androidx/compose/ui/text/LinkAnnotation$Url",
    "androidx/core/app/ShareCompat",
]
members = [
    "android/content/Context.startActivities",
    "android/content/Context.startActivity",
    "android/content/Context.startIntentSender",
    "androidx/compose/ui/platform/CompositionLocalsKt.getLocalUriHandler",
]
reason = "Opening other apps (e.g. URLs) must go through vtfx-gate-android."
allowed_modules = ["vtfx-gate-android"]

[[restricted_classes]]
# Apps make them and hand them to the session, which hands them to vtfx-gate.
classes = ["com/google/vtfx/gate/android/AndroidClipboard", "com/google/vtfx/gate/android/AndroidUrlOpener"]
reason = "Only the app may make the implementations of the clipboard and the URL opener; vtfx code reaches them through vtfx-gate (docs/decisions/0042)."
allowed_modules = ["vtfx-gate-android"]

[[restricted_classes]]
members = ["android/content/Context.getSystemService(Ljava/lang/String;)"]
reason = "A system service named by a string gets past the rules on its class; name the class (getSystemService(Class))."
allowed_modules = []

[[restricted_classes]]
packages = ["java/lang/reflect", "java/lang/invoke", "kotlin/reflect/full", "kotlin/reflect/jvm", "dalvik/system"]
classes = ["java/lang/ClassLoader"]
members = [
    "java/lang/Class.forName",
    "java/lang/Class.getConstructor",
    "java/lang/Class.getConstructors",
    "java/lang/Class.getDeclaredConstructor",
    "java/lang/Class.getDeclaredConstructors",
    "java/lang/Class.getDeclaredField",
    "java/lang/Class.getDeclaredFields",
    "java/lang/Class.getDeclaredMethod",
    "java/lang/Class.getDeclaredMethods",
    "java/lang/Class.getField",
    "java/lang/Class.getFields",
    "java/lang/Class.getMethod",
    "java/lang/Class.getMethods",
]
reason = "Reflection and loading classes can bypass visibility and these rules, which the module boundaries rely on."
allowed_modules = []

[[restricted_classes]]
classes = ["java/lang/Process", "java/lang/ProcessBuilder", "java/lang/ProcessHandle", "java/lang/Runtime"]
reason = "vtfx does not start processes (docs/REQUIREMENTS.md section 4.2)."
allowed_modules = []

[[restricted_classes]]
packages = ["android/webkit", "java/net", "javax/net", "okhttp3"]
classes = ["android/app/DownloadManager"]
reason = "vtfx does not access the network. The app owns the connection to the host."
allowed_modules = []

[[restricted_classes]]
# vtfx-font-gate-android makes typefaces from SanitizedFont alone, whose bytes passed the verifier of
# vtfx-font-gate (docs/decisions/0040, 0041); the module is under security review.
packages = ["android/graphics/fonts", "androidx/compose/ui/text/googlefonts"]
classes = [
    "android/graphics/Typeface$Builder",
    "android/graphics/Typeface$CustomFallbackBuilder",
    "android/os/ParcelFileDescriptor",
    "androidx/compose/ui/text/font/AndroidFont",
    "androidx/compose/ui/text/font/AndroidFontKt",
    "androidx/compose/ui/text/font/LoadedFontFamily",
]
members = [
    "android/graphics/Typeface.createFromAsset",
    "android/graphics/Typeface.createFromFile",
    "androidx/compose/ui/text/font/AndroidTypeface_androidKt.FontFamily",
]
reason = "vtfx draws only fonts of the system, of the app's package, or sanitized by vtfx-font (TerminalFont); font files from elsewhere may be malicious (docs/decisions/0020, 0040)."
allowed_modules = ["vtfx-font-gate-android"]

[[restricted_classes]]
classes = ["android/graphics/BitmapFactory", "android/graphics/ImageDecoder"]
reason = "Images from the host must not reach the platform's native decoders; vtfx decodes them itself (docs/decisions/0038)."
allowed_modules = []

# Packages, with their subpackages, in which only the listed modules may declare classes.
[[reserved_packages]]
# vtfx-font-gate keeps all its classes in a package of its own, which it shares with no other module,
# and vtfx-font-gate-android has a subpackage of it.
package = "com/google/vtfx/font/gate"
modules = ["vtfx-font-gate", "vtfx-font-gate-android"]
reason = "A class of the same name in another module could replace a reviewed one on the class path (docs/decisions/0041)."

# APIs that may only appear in the listed paths. Patterns are Python regular expressions matched
# against each line of Kotlin and Java sources. Paths are fnmatch patterns relative to the
# repository root, where "*" also matches "/".
[[restricted_apis]]
# Includes Compose's clipboard (LocalClipboardManager, LocalClipboard, ClipEntry).
pattern = '\b(ClipboardManager|ClipData|LocalClipboardManager|LocalClipboard|ClipEntry)\b'
reason = "Clipboard access must go through vtfx-gate-android."
allowed_paths = ["vtfx-gate-android/**"]

[[restricted_apis]]
# Includes Compose's URL opening (LocalUriHandler, UriHandler, LinkAnnotation.Url) and AndroidX's
# sharing and Custom Tabs (ShareCompat, CustomTabsIntent), which open other apps without naming Intent.
pattern = '\b(Intent|startActivity|PendingIntent|LocalUriHandler|UriHandler|ShareCompat|CustomTabsIntent)\b|\bLinkAnnotation\.Url\b'
reason = "Opening other apps (e.g. URLs) must go through vtfx-gate-android."
allowed_paths = ["vtfx-gate-android/**"]

[[restricted_apis]]
pattern = '\bHostConnection\b'
reason = "Only vtfx-gate may hold the connection to the host. TerminalSession only hands it over (docs/decisions/0027)."
allowed_paths = ["vtfx-gate/**", "vtfx-session/src/main/kotlin/com/google/vtfx/session/TerminalSession.kt"]

[[restricted_apis]]
# Tests may implement fakes of them; test code is not shipped (docs/decisions/0042).
pattern = '\b(ClipboardAccess|UrlOpener)\b'
reason = "Only vtfx-gate may call the clipboard and the URL opener, which vtfx-gate-android implements. TerminalSession only hands them over (docs/decisions/0042)."
allowed_paths = ["vtfx-gate/**", "vtfx-gate-android/**", "vtfx-session/src/main/kotlin/com/google/vtfx/session/TerminalSession.kt", "*/src/test/**"]

[[restricted_apis]]
# vtfx-font-gate keeps all its classes in a package of its own, which it shares with no other module,
# and vtfx-font-gate-android has a subpackage of it.
pattern = '\bpackage\s+com\.google\.vtfx\.font\.gate\b'
reason = "Only the font gate modules may declare classes in com.google.vtfx.font.gate and its subpackages: a class of the same name in another module could replace a reviewed one on the class path (docs/decisions/0041)."
allowed_paths = ["vtfx-font-gate/**", "vtfx-font-gate-android/**"]

[[restricted_apis]]
pattern = '\bjava\.lang\.(reflect|invoke)\b|\bkotlin\.reflect\.(full|jvm)\b|\bClass\.forName\b|\.getDeclared(Field|Method|Constructor)s?\b'
reason = "Reflection can bypass visibility, which the module boundaries rely on."
allowed_paths = []

[[restricted_apis]]
pattern = '\bRuntime\.getRuntime\(\)|\bProcessBuilder\b'
reason = "vtfx does not start processes (docs/REQUIREMENTS.md section 4.2)."
allowed_paths = []

[[restricted_apis]]
pattern = '\bjava\.net\.|\bjavax\.net\b|\bandroid\.webkit\.|\bokhttp3\b|\bDownloadManager\b'
reason = "vtfx does not access the network. The app owns the connection to the host."
allowed_paths = []

[[restricted_apis]]
pattern = '\bTypeface\.(createFromFile|createFromAsset|Builder|CustomFallbackBuilder)\b|\bandroid\.graphics\.fonts\b|\b(AndroidFont|GoogleFont|LoadedFontFamily|ParcelFileDescriptor)\b|\bFont\(\s*(File\b|file\s*=|path\s*=|fileDescriptor)|\bFontFamily\(\s*[Tt]ypeface\b'
reason = "vtfx draws only fonts of the system, of the app's package, or sanitized by vtfx-font (TerminalFont); font files from elsewhere may be malicious (docs/decisions/0020, 0040)."
# vtfx-font-gate-android makes typefaces from SanitizedFont alone, whose bytes passed the verifier of
# vtfx-font-gate (docs/decisions/0040, 0041); the module is under security review. The test stands
# for a font loading asynchronously.
allowed_paths = [
    "vtfx-font-gate-android/**",
    "vtfx-compose/src/test/kotlin/com/google/vtfx/compose/TerminalStyleTest.kt",
]
