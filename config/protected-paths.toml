# Paths whose changes scripts/report_protected_changes.py reports. The report does not fail the
# build; it lists the changes for human review and later audit (docs/REQUIREMENTS.md sections 6.1
# and 7.2).
#
# Paths are fnmatch patterns relative to the repository root, where "*" also matches "/".
#
# Changes to this file require security review.

[security_review]
description = "Code with external effects, the check of fonts before native code reads them, and build and dependency configuration."
# Code is listed by whole modules, never by single files (docs/decisions/0041): what a module's code
# relies on is then reviewed with it.
paths = [
    "vtfx-gate/**",
    "vtfx-gate-android/**",
    "vtfx-font-gate/**",
    "vtfx-font-gate-android/**",
    "settings.gradle.kts",
    "build.gradle.kts",
    "**/build.gradle.kts",
    "gradle.properties",
    "gradle/**",
    "gradlew",
    "gradlew.bat",
    "build-logic/**",
    ".github/**",
    "config/**",
    "scripts/check_boundaries.py",
    "scripts/report_protected_changes.py",
    "scripts/tests/test_check_boundaries.py",
    "scripts/check.sh",
]

[process]
description = "The rules that agents follow. Check that they were not loosened."
paths = [
    "AGENTS.md",
    "docs/REQUIREMENTS.md",
    "docs/design/testing.md",
    "docs/reviews/README.md",
]

[oracle]
description = "Human-owned specification tests, fixtures, and goldens. Agents must not change them."
paths = [
    "spec/**",
    "tools/ime-probe/traces/**",
]
