# Publishes the HTML API reference of the default branch to GitHub Pages (docs/decisions/0090).

name: api-reference

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, and a deployment in progress is not cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      # The source links point at the commit that the reference is built from (vtfx.dokka).
      - name: Generate the API reference
        run: ./gradlew --console=plain "-Pvtfx.sourceRef=$GITHUB_SHA" :dokkaGenerate

      - name: Check the links of the API reference
        run: python3 -I scripts/check_api_reference.py build/dokka/html

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/dokka/html

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    # Only this job can write to Pages; the build, which runs Gradle, cannot.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
